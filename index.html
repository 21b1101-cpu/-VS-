#hb{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 44px);display:none;z-index:5;background:#7a1f3a;color:#ffe8f0;border:2px solid #ff9ab8;border-radius:10px;padding:6px 12px;font:700 14px inherit;font-family:inherit;cursor:pointer;box-shadow:0 0 12px #ff5e8a88}#hb:disabled{background:#444;border-color:#777;color:#aaa;box-shadow:none;cursor:default}
@keyframes pp{from{transform:scale(.2) rotate(-12deg);opacity:0}60%{transform:scale(1.12) rotate(3deg);opacity:1}to{transform:scale(1) rotate(0)}}

.cards>*,.rooms>*,.menu>*,.ml>*{animation:ci .5s cubic-bezier(.2,1.4,.4,1) both}@keyframes ci{from{opacity:0;transform:translateY(24px) scale(.9)}}
:is(.menu,.cards,.rooms,.ml)>*:nth-child(2){animation-delay:.07s}:is(.menu,.cards,.rooms,.ml)>*:nth-child(3){animation-delay:.14s}:is(.menu,.cards,.rooms,.ml)>*:nth-child(4){animation-delay:.21s}:is(.menu,.cards,.rooms,.ml)>*:nth-child(5){animation-delay:.28s}:is(.menu,.cards,.rooms,.ml)>*:nth-child(6){animation-delay:.35s}:is(.menu,.cards,.rooms,.ml)>*:nth-child(n+7){animation-delay:.42s}
.card:not(:disabled):hover{transform:translateY(-4px) scale(1.03);box-shadow:0 0 22px rgba(255,216,107,.45)}.btn:hover{filter:brightness(1.12);box-shadow:0 0 18px rgba(255,154,60,.5)}
.t h1{background:linear-gradient(90deg,#ff9a3c,#ff5e8a,#5ee6d0,#ff9a3c);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:ts 4s linear infinite}@keyframes ts{to{background-position:-200% 0}}

<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<script>
const cv=document.getElementById('c'),C=cv.getContext('2d'),ov=document.getElementById('ov');
let W,H,S='title',P,E,B,G,F,EB=[],frz=0,bonus=0,rb=0,ri=0,jt=10,T,kills,spawnT,bossN,L,cd,ang,shake,banner,best=0,last=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;C.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let SV=fresh();try{const j=JSON.parse(localStorage.getItem('nekosave'));if(j)SV={...SV,...j,up:{...SV.up,...j.up}};SV.best=SV.best||+localStorage.getItem('nekobest')||0;if(j&&j.v!==2)SV.best=0;SV.v=2}catch(e){}
function fresh(){return{coins:0,best:0,up:{hp:0,atk:0,spd:0,mag:0,xp:0},skins:['cat'],skin:'cat',maps:['field'],map:'field',mode:'normal',clear:{},ttl:'',dm:null,tk:0,ach:[],tr:[],area:1,v:2}}
const keys={};let joy=null,jv={x:0,y:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(S==='lv'&&'123'.includes(e.key))pick(+e.key-1);if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{joy={x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY}});
cv.addEventListener('pointermove',e=>{if(!joy)return;if(e.pointerType==='mouse'&&!e.buttons){upj();return}const dx=e.clientX-joy.x,dy=e.clientY-joy.y,l=Math.hypot(dx,dy);joy.cx=e.clientX;joy.cy=e.clientY;if(l>2){const k=Math.min(l,60)/60;jv={x:dx/l*k,y:dy/l*k}}});
const upj=()=>{joy=null;jv={x:0,y:0}};
addEventListener('pointerup',upj);addEventListener('pointercancel',upj);
function clearIn(){for(const k in keys)keys[k]=0;upj()}
addEventListener('blur',clearIn);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearIn()});

const U=[
['fish','🐟','ほねぬき魚',6,'最寄りの敵へ魚を連射。Lv3で貫通、Lv2/4/6で本数アップ'],
['yarn','🧶','毛糸玉スピン',6,'毛糸玉が周りを回って敵を弾く。数と威力が増える'],
['paw','🐾','肉球ショック',6,'周囲に衝撃波。敵を遠くへ吹っ飛ばす'],
['bolt','⚡','ねこ雷',6,'画面内の敵に落雷。レベルで落雷数が増える'],
['bomb','🧨','ねこ花火',6,'足元に爆弾を設置。1秒後に範囲爆発'],
['spd','👟','しなやか足',5,'移動速度 +12%'],
['mag','🧲','おねだり磁石',5,'経験値を遠くから吸い寄せる'],
['hp','🍙','おにぎり腹',5,'最大HP +25 して全回復'],
['reg','🍵','まったりお茶',5,'HPが毎秒じわじわ回復'],
['evo1','🌟','進化：流星魚群',1,'魚Lv6＋毛糸玉Lv3。全方位に貫通する魚を乱れ撃ち',()=>L.fish>=6&&L.yarn>=3],
['evo2','🌟','進化：雷神ビンタ',1,'肉球Lv6＋雷Lv3。衝撃波のたびに雷が5発落ちる',()=>L.paw>=6&&L.bolt>=3]
];
function reset(){P={slow:0,x:0,y:0,hp:100+10*SV.up.hp,mh:100+10*SV.up.hp,sp:170*(1+.04*SV.up.spd),lv:1,xp:0,need:8,inv:0};E=[];B=[];G=[];F=[];EB=[];frz=0;bonus=0;rb=0;ri=0;jt=10;GOT=[];idoor=null;ICB=[];FX=[];T=0;kills=0;spawnT=0;bossN=0;L={fish:1,yarn:0,paw:0,bolt:0,spd:0,mag:0,hp:0,reg:0,bomb:0,evo1:0,evo2:0};cd={fish:0,paw:0,bolt:0,bomb:0,evo1:0};ang=0;shake=0;banner=null}
reset();
let AC;
function sfx(f,d,t,v){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
function zap(n,d){const c=E.filter(e=>dist(e,P)<Math.min(W,H)*.6);for(let i=0;i<n&&c.length;i++){const t=c.splice(Math.random()*c.length|0,1)[0];F.push({bolt:1,x:t.x,y:t.y,t:.25});sfx(900,.08,'triangle',.05);for(const e of E)if(Math.hypot(e.x-t.x,e.y-t.y)<50)hit(e,d)}}
function start(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}fixSV();JGM=0;IGM=0;CVM=0;if(SV.map==='jungle'){SV.jm=SV.map;startJg(1);return}reset();S='play';ov.className='h'}
const fmt=t=>(t/60|0)+':'+String(t%60|0).padStart(2,'0');
function showLv(){S='lv';clearIn();sfx(660,.15,'triangle',.1);sfx(990,.25,'triangle',.1);
 const all=U.filter(u=>L[u[0]]<u[3]&&(!u[5]||u[5]())).sort(()=>Math.random()-.5),isE=u=>u[0].startsWith('evo');
 const pool=[...all.filter(isE),...all.filter(u=>!isE(u))].slice(0,3);
 if(!pool.length){P.hp=P.mh;S='play';return}
 ov.className='';ov.innerHTML=`<h2>レベルアップ！ Lv${P.lv}</h2><div class="cards">${pool.map((u,i)=>`<button class="card" data-i="${i}"><i>${ic(u[1])}</i><b>${u[2]}</b><em>${u[0].startsWith('evo')?'★進化！':L[u[0]]?'Lv'+L[u[0]]+' → Lv'+(L[u[0]]+1):'NEW!'}</em><small>${u[4]}</small></button>`).join('')}</div>`;
 ov._p=pool;ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>pick(+b.dataset.i));ov.querySelector('.card').focus()}
function pick(i){const u=ov._p&&ov._p[i];if(!u)return;L[u[0]]++;if(u[0]==='hp'){P.mh+=25;P.hp=P.mh}ov._p=null;ov.className='h';S='play';chk()}
function chk(){if(P.xp>=P.need){P.xp-=P.need;P.lv++;lvFx();P.need=Math.floor(P.need*1.5+10);showLv()}}

function eshoot(e){const a=Math.atan2(P.y-e.y,P.x-e.x),n=e.pat||1,rg=n>3,sp=e.bs||(e.boss?170:200)*(e.e==='🧅'?1:.85);
 for(let i=0;i<n;i++){const an=rg?i*6.2832/n:a+(n===1?0:(i-(n-1)/2)*.25);EB.push({x:e.x,y:e.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,d:e.boss?10:7,r:e.boss?8:6,t:4})}}

function fxBurst(x,y,n,cols,sp,life,kind){for(let i=0;i<n&&FX.length<700;i++){const a=Math.random()*6.283,v=sp*(.3+Math.random()*.7);FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:life*(.6+Math.random()*.6),m:life,c:cols[Math.random()*cols.length|0],k:kind||0,r:2+Math.random()*3,rot:Math.random()*6.283,vr:(Math.random()-.5)*14})}}
function fxRing(x,y,R,c,life){if(FX.length<700)FX.push({x,y,vx:0,vy:0,t:life||.5,m:life||.5,c,k:2,R,r:0,rot:0,vr:0})}
function fxUpd(dt){for(const p of FX){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.k===1)p.vy+=140*dt;p.rot+=p.vr*dt}FX=FX.filter(p=>p.t>0)}

 else if(p.k===1){C.globalAlpha=a;C.fillStyle=p.c;C.save();C.translate(p.x,p.y);C.rotate(p.rot);C.fillRect(-p.r,-p.r*.5,p.r*2,p.r);C.restore()}
 else{C.globalAlpha=a;C.fillStyle=p.c;C.beginPath();C.arc(p.x,p.y,p.r*(.4+a),0,6.283);C.fill()}}C.restore()}
