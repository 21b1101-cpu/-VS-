function dbgLv(){dbgSnap();SV.up=SV.up||{};SV.sklv=SV.sklv||{};SV.skrk=SV.skrk||{};

var CVD=null,CVP=null;
function cvBuild(){if(CVD)return CVD;const N=420,r=(n,k)=>hh(n,k,31),P=[];P[N]=[0,0];
 for(let n=1;n<=N;n++){const a=(r(n,1)<.5?-1:1)*(.42+.6*r(n,2)),L=360+160*r(n,3),q=P[N+n-1];P[N+n]=[q[0]+Math.cos(a)*L,q[1]+Math.sin(a)*L]}
 for(let n=1;n<=N;n++){const a=Math.PI+(r(-n,1)<.5?-1:1)*(.42+.6*r(-n,2)),L=360+160*r(-n,3),q=P[N-n+1];P[N-n]=[q[0]+Math.cos(a)*L,q[1]+Math.sin(a)*L]}
 const nodes=P.slice(),edges=[],adj=[];for(let i=0;i<=2*N;i++)adj[i]=[];
 const link=(a,b,hw)=>{edges.push([a,b,hw]);(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a)};
 for(let i=0;i<2*N;i++)link(i,i+1,100);
 for(let i=1;i<2*N-4;i++)for(let rp=0;rp<2;rp++){if(hh(i,rp,33)>=(rp?.45:.78))continue;const k=hh(i,rp,34)<.5?2:3,A=P[i],B=P[i+k],dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy)||1,sd=(hh(i,0,35)<.5?-1:1)*(rp?-1:1),off=(300+200*hh(i,rp,36))*sd,nx=-dy/l*off,ny=dx/l*off,q1=[A[0]+dx*.33+nx,A[1]+dy*.33+ny],q2=[A[0]+dx*.66+nx,A[1]+dy*.66+ny],i1=nodes.length;nodes.push(q1);nodes.push(q2);adj[i1]=[];adj[i1+1]=[];link(i,i1,34);link(i1,i1+1,34);link(i1+1,i+k,34)}
 const grid=new Map(),add=(x,y,e)=>{const k=Math.floor(x/400)+','+Math.floor(y/400);let g=grid.get(k);if(!g){g=new Set();grid.set(k,g)}g.add(e)};
 for(const e of edges){const a=nodes[e[0]],b=nodes[e[1]],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(L/120));for(let t=0;t<=n;t++)add(a[0]+(b[0]-a[0])*t/n,a[1]+(b[1]-a[1])*t/n,e)}
 return CVD={nodes,edges,adj,grid}}
function cvEdges(x,y,pad){const D=cvBuild(),c=Math.floor(x/400),d=Math.floor(y/400),out=new Set();for(let i=c-1;i<=c+1;i++)for(let j=d-1;j<=d+1;j++){const g=D.grid.get(i+','+j);if(g)for(const e of g)out.add(e)}return out}
function caveWalk(x,y){const D=cvBuild();for(const e of cvEdges(x,y)){const a=D.nodes[e[0]],b=D.nodes[e[1]],vx=b[0]-a[0],vy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*vx+(y-a[1])*vy)/(vx*vx+vy*vy||1))),px=a[0]+vx*t-x,py=a[1]+vy*t-y;if(px*px+py*py<e[2]*e[2])return true}return false}
function cvNear(x,y){const D=cvBuild();let best=-1,bd=1e18;for(const e of cvEdges(x,y))for(const i of[e[0],e[1]]){const p=D.nodes[i],d=(p[0]-x)**2+(p[1]-y)**2;if(d<bd){bd=d;best=i}}return best}
function cvDist(){const D=cvBuild(),pn=cvNear(P.x,P.y);if(CVP&&CVP.k===pn)return CVP.d;const d=new Map([[pn,0]]),q=[pn];for(let h=0;h<q.length;h++){const n=q[h],c=d.get(n);if(c>=30)continue;for(const m of D.adj[n]||[])if(!d.has(m)){d.set(m,c+1);q.push(m)}}CVP={k:pn,d};return d}
function caveDir(e,dx,dy,l){const D=cvBuild();if(l<260){let ok=1;for(let t=.25;t<1;t+=.25)if(!caveWalk(e.x+dx*t,e.y+dy*t)){ok=0;break}if(ok)return[dx/l,dy/l]}
 const d=cvDist(),n=cvNear(e.x,e.y);if(n<0||!d.has(n)||d.get(n)===0)return[dx/l,dy/l];let best=n,bd=d.get(n);for(const m of D.adj[n]||[]){const v=d.get(m);if(v!==undefined&&v<bd){bd=v;best=m}}const p=D.nodes[best],ux=p[0]-e.x,uy=p[1]-e.y,ul=Math.hypot(ux,uy)||1;return[ux/ul,uy/ul]}
function cvPaint(x0,y0){const D=cvBuild(),vis=new Set();for(let x=Math.floor(x0/400)-1;x<=Math.ceil((x0+W)/400)+1;x++)for(let y=Math.floor(y0/400)-1;y<=Math.ceil((y0+H)/400)+1;y++){const g=D.grid.get(x+','+y);if(g)for(const e of g)vis.add(e)}
 C.lineCap='round';C.lineJoin='round';for(const [pass,pad] of [[0,16],[1,0],[2,0]])for(const e of vis){const a=D.nodes[e[0]],b=D.nodes[e[1]],th=e[2]>60;C.strokeStyle=pass===0?'#05080d':pass===1?(th?'#26354a':'#2c3d56'):(th?'rgba(130,170,210,.09)':'rgba(130,170,210,.12)');C.lineWidth=pass===2?(th?60:14):e[2]*2+pad*2;C.beginPath();C.moveTo(a[0],a[1]);C.lineTo(b[0],b[1]);C.stroke()}}
